<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dota Guide</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #0f172a;
    color: white;
}

header {
    background: linear-gradient(90deg, #7c3aed, #9333ea);
    padding: 20px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
}

.container {
    padding: 20px;
}

.filter {
    margin-bottom: 20px;
}

button {
    background: #7c3aed;
    border: none;
    padding: 10px;
    color: white;
    margin-right: 10px;
    cursor: pointer;
    border-radius: 6px;
}

.heroes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background-color: #1e293b;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
    background-color: #334155;
}

.card img {
    width: 100%;
    border-radius: 10px;
}

.card h3 {
    color: #a78bfa;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
}

.modal-content {
    background: #1e293b;
    margin: 5% auto;
    padding: 20px;
    width: 80%;
    border-radius: 12px;
}

.close {
    float: right;
    cursor: pointer;
    font-size: 20px;
}
</style>

</head>

<body>

<header>Dota 2 Carry Guide</header>

<div class="container">

<div class="filter">
    <button onclick="filterHeroes('all')">All</button>
    <button onclick="filterHeroes('carry')">Carry</button>
</div>

<div class="heroes" id="heroList">

<div class="card carry" onclick="openHero('pa')">
<img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/phantom_assassin.png">
<h3>Phantom Assassin</h3>
</div>

<div class="card carry" onclick="openHero('jugg')">
<img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/juggernaut.png">
<h3>Juggernaut</h3>
</div>

<div class="card carry" onclick="openHero('void')">
<img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/faceless_void.png">
<h3>Faceless Void</h3>
</div>

<div class="card carry" onclick="openHero('tb')">
<img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/terrorblade.png">
<h3>Terrorblade</h3>
</div>

</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">X</span>

<h2 id="heroName"></h2>
<p id="heroDesc"></p>

<h3>When to pick</h3>
<p id="heroWhen"></p>

<h3>Build</h3>
<p id="heroBuild"></p>

</div>
</div>

<script>
const heroes = {
    pa: {
        name: "Phantom Assassin",
        desc: "High burst damage carry.",
        when: "Good against squishy heroes.",
        build: "Early: Battle Fury | Mid: Desolator, BKB | Late: Satanic, Abyssal"
    },
    jugg: {
        name: "Juggernaut",
        desc: "Balanced carry with sustain.",
        when: "Safe pick in most games.",
        build: "Early: Maelstrom | Mid: Manta | Late: Butterfly"
    },
    void: {
        name: "Faceless Void",
        desc: "Teamfight control carry.",
        when: "Great with AoE teammates.",
        build: "Early: MoM | Mid: Maelstrom, BKB | Late: Mjollnir"
    },
    tb: {
        name: "Terrorblade",
        desc: "Strong illusion carry.",
        when: "Good for split push.",
        build: "Early: Dragon Lance | Mid: Manta, Skadi | Late: Butterfly"
    }
};

function openHero(hero) {
    document.getElementById("modal").style.display = "block";
    document.getElementById("heroName").innerText = heroes[hero].name;
    document.getElementById("heroDesc").innerText = heroes[hero].desc;
    document.getElementById("heroWhen").innerText = heroes[hero].when;
    document.getElementById("heroBuild").innerText = heroes[hero].build;
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

function filterHeroes(role) {
    let cards = document.querySelectorAll(".card");
    cards.forEach(card => {
        if (role === "all" || card.classList.contains(role)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
</script>

</body>
</html>
